name: Cords checks

"on":
  push:
    branches: [main]
    tags: ["v*", "V*"]
  pull_request:

jobs:
  rust-and-frontend:
    runs-on: ubuntu-22.04
    container:
      image: node:24-bookworm
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: cords
          POSTGRES_USER: cords
          POSTGRES_PASSWORD: cords-ci
    env:
      DATABASE_URL: postgres://cords:cords-ci@postgres:5432/cords
      CORDS_TEST_DATABASE_URL: postgres://cords:cords-ci@postgres:5432/cords
    steps:
      - name: Install toolchains and checkout
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends build-essential ca-certificates curl git jq libayatana-appindicator3-dev librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev pkg-config wget
          curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.97.1
          export PATH="${HOME}/.cargo/bin:${PATH}"
          rustup component add rustfmt clippy
          cargo install cargo-deny --locked
          test -n "${FORGEJO_SERVER_URL:-}"
          test -n "${FORGEJO_REPOSITORY:-}"
          git init --initial-branch=main .
          git remote add origin "${FORGEJO_SERVER_URL}/${FORGEJO_REPOSITORY}.git"
          git fetch --depth=1 origin "${FORGEJO_REF:-refs/heads/main}"
          git checkout --detach FETCH_HEAD
      - name: Frontend checks
        working-directory: bins/cords-client/ui
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm audit --audit-level=high
          npm run format:check
          npm run check
          npm run lint
          npm test
          npm run build
      - name: Rust checks
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${HOME}/.cargo/bin:${PATH}"
          test -f bins/cords-client/ui/dist/index.html
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-features
          cargo test -p cords-server-core -- --ignored --test-threads=1
          cargo deny check

  containers:
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/catthehacker/ubuntu:act-22.04
    steps:
      - uses: https://pubcode.archuser.org/actions/checkout@v4
      - name: Scan source for secrets
        shell: bash
        run: |
          set -euo pipefail
          gitleaks_image='ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f'
          scan_container="$(docker create --network none "${gitleaks_image}" dir /source --config /source/.gitleaks.toml --redact --no-banner)"
          cleanup_scan() {
            docker rm --force "${scan_container}" >/dev/null 2>&1 || true
          }
          trap cleanup_scan EXIT
          docker cp "$PWD/." "${scan_container}:/source"
          docker start --attach "${scan_container}"
          scan_exit="$(docker inspect --format '{{.State.ExitCode}}' "${scan_container}")"
          [[ "${scan_exit}" == 0 ]] || {
            echo "error: Gitleaks exited with status ${scan_exit}" >&2
            exit "${scan_exit}"
          }
      - name: Build and start supported topology
        shell: bash
        run: |
          set -euo pipefail
          docker version || { echo 'error: Docker daemon unavailable; see .forgejo/docs/release-workflow.md for isolated runner configuration' >&2; exit 1; }
          docker compose version
          docker compose up --build --wait
          curl --fail --silent http://127.0.0.1:4849/health/ready
          curl --fail --silent http://127.0.0.1:4849/.well-known/cords/server | jq -e '.protocol_min == 1 and .signature != ""'
      - name: Stop topology
        if: always()
        run: docker compose down --volumes

  qt-linux:
    name: Native Qt desktop (Linux x86_64)
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/catthehacker/ubuntu:act-22.04
    steps:
      - uses: https://pubcode.archuser.org/actions/checkout@v4
      - name: Install native Qt build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential ca-certificates curl file libegl1 libgl1-mesa-dev libx11-xcb1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxkbcommon-x11-0 pkg-config python3-venv
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.97.1
          fi
          export PATH="${HOME}/.cargo/bin:${PATH}"
          rustup toolchain install 1.97.1 --profile minimal
          echo "${HOME}/.cargo/bin" >> "${GITHUB_PATH}"
          python3 -m venv .qt-tools
          .qt-tools/bin/python -m pip install aqtinstall==3.3.0 cmake==3.31.6
          .qt-tools/bin/python -m aqt install-qt linux desktop 6.10.3 linux_gcc_64 -O "$PWD/.qt-sdk" --archives icu qtbase qtdeclarative qtsvg qttools qttranslations qtwayland
      - name: Build, test and package Qt desktop
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$PWD/.qt-tools/bin:${HOME}/.cargo/bin:${PATH}"
          export CORDS_QT_PREFIX="$PWD/.qt-sdk/6.10.3/gcc_64"
          export CARGO_BUILD_JOBS=4
          bash build-scripts/linux-client-tar.sh

  qt-windows:
    # Native host required; the former Linux cargo-xwin job cannot deploy Qt.
    # Runner availability is an infrastructure gate, never a successful skip.
    name: Native Qt desktop (Windows x86_64)
    runs-on: windows-latest
    steps:
      - uses: https://pubcode.archuser.org/actions/checkout@v4
      - name: Install pinned Qt build tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          rustup toolchain install 1.97.1 --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain installation failed' }
          python -m venv .qt-tools
          if ($LASTEXITCODE -ne 0) { throw 'Python environment creation failed' }
          & ./.qt-tools/Scripts/python.exe -m pip install aqtinstall==3.3.0 cmake==3.31.6
          if ($LASTEXITCODE -ne 0) { throw 'Qt build tool installation failed' }
          & ./.qt-tools/Scripts/python.exe -m aqt install-qt windows desktop 6.10.3 win64_msvc2022_64 -O "$PWD/.qt-sdk" --archives qtbase qtdeclarative qtsvg qttools qttranslations
          if ($LASTEXITCODE -ne 0) { throw 'Qt SDK installation failed' }
      - name: Build, test and package Qt desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:CORDS_PYTHON = "$PWD/.qt-tools/Scripts/python.exe"
          $env:CARGO_BUILD_JOBS = '4'
          & ./build-scripts/windows-client.ps1 -QtPrefix "$PWD/.qt-sdk/6.10.3/msvc2022_64" -CMake "$PWD/.qt-tools/Scripts/cmake.exe"

  qt-macos:
    name: Native Qt desktop (macOS)
    runs-on: macos-latest
    steps:
      - uses: https://pubcode.archuser.org/actions/checkout@v4
      - name: Install pinned Qt build tools
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal
          python3 -m venv .qt-tools
          .qt-tools/bin/python -m pip install aqtinstall==3.3.0 cmake==3.31.6
          .qt-tools/bin/python -m aqt install-qt mac desktop 6.10.3 clang_64 -O "$PWD/.qt-sdk" --archives qtbase qtdeclarative qtsvg qttools qttranslations
      - name: Build, test and package Qt desktop
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$PWD/.qt-tools/bin:${PATH}"
          export CORDS_QT_PREFIX="$PWD/.qt-sdk/6.10.3/macos"
          export CARGO_BUILD_JOBS=4
          bash build-scripts/mac-client-pkg.sh
