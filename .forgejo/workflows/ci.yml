name: Phase 0 checks

'on':
  push:
    branches: [main]
    tags: ["v*", "V*"]
  pull_request:

jobs:
  rust-and-frontend:
    runs-on: ubuntu-22.04
    container:
      image: node:24-bookworm
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: cords
          POSTGRES_USER: cords
          POSTGRES_PASSWORD: cords-ci
    env:
      DATABASE_URL: postgres://cords:cords-ci@postgres:5432/cords
    steps:
      - name: Install toolchains and checkout
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends build-essential ca-certificates curl git jq libayatana-appindicator3-dev librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev pkg-config wget
          curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.97.1
          export PATH="${HOME}/.cargo/bin:${PATH}"
          rustup component add rustfmt clippy
          cargo install cargo-deny --locked
          test -n "${FORGEJO_SERVER_URL:-}"
          test -n "${FORGEJO_REPOSITORY:-}"
          git init --initial-branch=main .
          git remote add origin "${FORGEJO_SERVER_URL}/${FORGEJO_REPOSITORY}.git"
          git fetch --depth=1 origin "${FORGEJO_REF:-refs/heads/main}"
          git checkout --detach FETCH_HEAD
      - name: Rust checks
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${HOME}/.cargo/bin:${PATH}"
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-features
          cargo deny check
      - name: Frontend checks
        working-directory: bins/cords-client/ui
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run format:check
          npm run check
          npm run lint
          npm test
          npm run build

  containers:
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/catthehacker/ubuntu:act-22.04
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - name: Build and start supported topology
        shell: bash
        run: |
          set -euo pipefail
          docker version || { echo 'error: Docker daemon unavailable; see .forgejo/docs/release-workflow.md for isolated runner configuration' >&2; exit 1; }
          docker compose version
          docker compose up --build --wait
          curl --fail --silent http://127.0.0.1:4849/health/ready
          curl --fail --silent http://127.0.0.1:4849/.well-known/cords/server | jq -e '.protocol_min == 1 and .signature != ""'
      - name: Stop topology
        if: always()
        run: docker compose down --volumes

  client-platform-check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: linux-x86_64
            image: ghcr.io/catthehacker/ubuntu:act-22.04
          - runner: arm-ubuntu-22.04
            platform: linux-aarch64
            image: ghcr.io/catthehacker/ubuntu:act-22.04
          - runner: macos-latest
            platform: macos-aarch64
            image: ""
    name: Client check (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - uses: https://code.forgejo.org/actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: bins/cords-client/ui/package-lock.json
      - name: Install Linux Tauri prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - working-directory: bins/cords-client/ui
        run: npm ci
      - run: cargo check -p cords-client

  windows-cross-check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            architecture: x86_64
            target: x86_64-pc-windows-msvc
          - runner: arm-ubuntu-22.04
            architecture: aarch64
            target: aarch64-pc-windows-msvc
    name: Windows cross-check (${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    container:
      image: node:24-bookworm
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - name: Install cross-compilation toolchain
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends build-essential ca-certificates clang curl git lld llvm pkg-config xz-utils zip
          curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.97.1
          export PATH="${HOME}/.cargo/bin:${PATH}"
          rustup target add "${{ matrix.target }}"
          cargo install cargo-xwin --locked --version 0.23.1
      - name: Build frontend and check Windows client
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${HOME}/.cargo/bin:${PATH}"
          bash build-scripts/linux-windows-client-crosscomp.sh --target "${{ matrix.architecture }}"
