name: Build, sign, publish, and mirror Cords

"on":
  push:
    tags: ["v*", "V*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CANONICAL_IMAGE: pubcode.archuser.org/firebadnofire/cords
  GHCR_IMAGE: ghcr.io/firebadnofire/cords
  GITHUB_MIRROR_REPOSITORY: firebadnofire/cords
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Select immutable release identity
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/catthehacker/ubuntu:act-22.04
    outputs:
      release_tag: ${{ steps.identity.outputs.release_tag }}
      release_name: ${{ steps.identity.outputs.release_name }}
      trace_tag: ${{ steps.identity.outputs.trace_tag }}
      amd64_tag: ${{ steps.identity.outputs.amd64_tag }}
      arm64_tag: ${{ steps.identity.outputs.arm64_tag }}
    steps:
      - name: Derive release and container tags
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          : "${GITHUB_SHA:?Forgejo did not provide GITHUB_SHA}"
          : "${GITHUB_REF:?Forgejo did not provide GITHUB_REF}"
          trace_tag="sha-${GITHUB_SHA}"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            ref_name="${GITHUB_REF#refs/tags/}"
            [[ "${ref_name}" =~ ^[vV][0-9A-Za-z._-]+$ ]] || {
              echo "error: release tag is not safe: ${ref_name}" >&2
              exit 1
            }
            release_tag="${ref_name}"
            release_name="Cords ${ref_name}"
          else
            release_tag="build-${GITHUB_SHA}"
            release_name="Cords build ${GITHUB_SHA}"
          fi
          {
            echo "release_tag=${release_tag}"
            echo "release_name=${release_name}"
            echo "trace_tag=${trace_tag}"
            echo "amd64_tag=${trace_tag}-amd64"
            echo "arm64_tag=${trace_tag}-arm64"
          } >> "${GITHUB_OUTPUT}"

  client-linux:
    name: Linux client (${{ matrix.architecture }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            architecture: x86_64
          - runner: arm-ubuntu-22.04
            architecture: aarch64
    runs-on: ${{ matrix.runner }}
    container:
      image: node:24-bookworm
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: https://pubcode.archuser.org/actions/checkout@v4
      - name: Install Linux client toolchain
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends build-essential ca-certificates curl file git libayatana-appindicator3-dev librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev pkg-config wget
          curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.97.1
      - name: Build and package Linux client
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${HOME}/.cargo/bin:${PATH}"
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          CORDS_DIST_DIR=release bash build-scripts/linux-client-tar.sh
      - uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: client-linux-${{ matrix.architecture }}
          path: |
            release/*.tar.gz
            release/*.sha256
          if-no-files-found: error
          retention-days: 7

  client-windows:
    name: Windows client (${{ matrix.architecture }}, cross-compiled)
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            architecture: x86_64
            target: x86_64-pc-windows-msvc
          - runner: arm-ubuntu-22.04
            architecture: aarch64
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    container:
      image: node:24-bookworm
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: https://pubcode.archuser.org/actions/checkout@v4
      - name: Install Windows cross-compilation toolchain
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends build-essential ca-certificates clang curl git lld llvm pkg-config xz-utils zip
          curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.97.1
          export PATH="${HOME}/.cargo/bin:${PATH}"
          rustup target add "${{ matrix.target }}"
          cargo install cargo-xwin --locked --version 0.23.1
      - name: Build and package Windows client
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${HOME}/.cargo/bin:${PATH}"
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          CORDS_DIST_DIR=release bash build-scripts/linux-windows-client-crosscomp.sh --target "${{ matrix.architecture }}"
      - uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: client-windows-${{ matrix.architecture }}
          path: |
            release/*.zip
            release/*.sha256
          if-no-files-found: error
          retention-days: 7

  client-macos:
    name: macOS client (universal DMG)
    needs: prepare
    runs-on: macos-latest
    steps:
      - uses: https://pubcode.archuser.org/actions/checkout@v4
      - uses: https://pubcode.archuser.org/actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: bins/cords-client/ui/package-lock.json
      - name: Install universal Rust targets
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Build and package universal macOS client
        shell: bash
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          CORDS_DIST_DIR=release bash build-scripts/mac-client-dmg.sh
      - uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: client-macos-universal
          path: |
            release/*.dmg
            release/*.sha256
          if-no-files-found: error
          retention-days: 7

  server-linux:
    name: Linux server tarball (${{ matrix.architecture }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            architecture: x86_64
          - runner: arm-ubuntu-22.04
            architecture: aarch64
    runs-on: ${{ matrix.runner }}
    container:
      image: node:24-bookworm
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: https://pubcode.archuser.org/actions/checkout@v4
      - name: Install server build toolchain
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends build-essential ca-certificates curl git pkg-config
          curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.97.1
      - name: Build and package Linux server
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${HOME}/.cargo/bin:${PATH}"
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          CORDS_DIST_DIR=release bash build-scripts/linux-server-tar.sh
      - uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: server-linux-${{ matrix.architecture }}
          path: |
            release/*.tar.gz
            release/*.sha256
          if-no-files-found: error
          retention-days: 7

  container-architecture:
    name: Server container (${{ matrix.platform }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: linux/amd64
            suffix: amd64
          - runner: arm-ubuntu-22.04
            platform: linux/arm64
            suffix: arm64
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/catthehacker/ubuntu:act-22.04
    env:
      FORGEJO_TOKEN: ${{ forgejo.token }}
      FORGEJO_USER: ${{ github.actor }}
    steps:
      - uses: https://pubcode.archuser.org/actions/checkout@v4
      - name: Validate Docker build environment
        shell: bash
        run: |
          set -euo pipefail
          docker version || { echo 'error: Docker daemon unavailable; configure the isolated Forgejo runner Docker access described in .forgejo/docs/release-workflow.md' >&2; exit 1; }
          docker buildx version
      - name: Authenticate to canonical container registry
        shell: bash
        run: |
          set -euo pipefail
          : "${FORGEJO_TOKEN:?Forgejo did not provide its job token}"
          : "${FORGEJO_USER:?Forgejo did not provide the actor name}"
          printf '%s' "${FORGEJO_TOKEN}" | docker login pubcode.archuser.org --username "${FORGEJO_USER}" --password-stdin
      - name: Build and publish architecture image
        shell: bash
        env:
          ARCH_SUFFIX: ${{ matrix.suffix }}
          TRACE_TAG: ${{ needs.prepare.outputs.trace_tag }}
        run: |
          set -euo pipefail
          ARCH_TAG="${TRACE_TAG}-${ARCH_SUFFIX}"
          [[ "${ARCH_TAG}" =~ ^sha-[0-9a-f]{40,64}-(amd64|arm64)$ ]]
          CORDS_IMAGE_NAME="${CANONICAL_IMAGE}" CORDS_IMAGE_TAG="${ARCH_TAG}" bash build-scripts/linux-server-oci-img.sh
          docker push "${CANONICAL_IMAGE}:${ARCH_TAG}"
          docker buildx imagetools inspect "${CANONICAL_IMAGE}:${ARCH_TAG}"
      - name: Close canonical registry session
        if: always()
        run: docker logout pubcode.archuser.org || true

  publish-canonical-container:
    name: Publish and sign canonical server container
    needs: [prepare, container-architecture]
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/catthehacker/ubuntu:act-22.04
    outputs:
      container_digest: ${{ steps.publish.outputs.container_digest }}
      canonical_reference: ${{ steps.publish.outputs.canonical_reference }}
    env:
      FORGEJO_TOKEN: ${{ forgejo.token }}
      FORGEJO_USER: ${{ github.actor }}
    steps:
      - uses: https://pubcode.archuser.org/actions/checkout@v4
      - name: Install pinned publication tools
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl jq
          cosign_version=v3.1.2
          cosign_sha256=f7622ed3cf22e55e1ae6377c080979ff77a22da9981c11df222a2e444991e7cf
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error --output /tmp/cosign "https://github.com/sigstore/cosign/releases/download/${cosign_version}/cosign-linux-amd64"
          printf '%s  %s\n' "${cosign_sha256}" /tmp/cosign | sha256sum --check --strict
          chmod 0755 /tmp/cosign
          echo /tmp >> "${GITHUB_PATH}"
      - name: Authenticate to canonical registry
        shell: bash
        run: |
          set -euo pipefail
          : "${FORGEJO_TOKEN:?Forgejo did not provide its job token}"
          : "${FORGEJO_USER:?Forgejo did not provide the actor name}"
          printf '%s' "${FORGEJO_TOKEN}" | docker login pubcode.archuser.org --username "${FORGEJO_USER}" --password-stdin
      - name: Assemble and sign canonical manifest
        id: publish
        shell: bash
        env:
          AMD64_TAG: ${{ needs.prepare.outputs.amd64_tag }}
          ARM64_TAG: ${{ needs.prepare.outputs.arm64_tag }}
          COSIGN_B64: ${{ secrets.COSIGN_B64 }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          RELEASE_DIRECTORY: release
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          TRACE_TAG: ${{ needs.prepare.outputs.trace_tag }}
        run: bash scripts/publish-container.sh canonical
      - uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: cosign-public-key
          path: release/cosign.pub
          if-no-files-found: error
          retention-days: 7
      - name: Close canonical registry session
        if: always()
        run: docker logout pubcode.archuser.org || true

  publish-forgejo-release:
    name: Sign files and publish canonical Forgejo release
    needs:
      - prepare
      - client-linux
      - client-windows
      - client-macos
      - server-linux
      - publish-canonical-container
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/catthehacker/ubuntu:act-22.04
    env:
      FORGEJO_TOKEN: ${{ forgejo.token }}
      RELEASE_NAME: ${{ needs.prepare.outputs.release_name }}
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
      SOURCE_REVISION: ${{ github.sha }}
    steps:
      - uses: https://pubcode.archuser.org/actions/checkout@v4
      - uses: https://code.forgejo.org/forgejo/download-artifact@v4
        with: { name: client-linux-x86_64, path: release }
      - uses: https://code.forgejo.org/forgejo/download-artifact@v4
        with: { name: client-linux-aarch64, path: release }
      - uses: https://code.forgejo.org/forgejo/download-artifact@v4
        with: { name: client-windows-x86_64, path: release }
      - uses: https://code.forgejo.org/forgejo/download-artifact@v4
        with: { name: client-windows-aarch64, path: release }
      - uses: https://code.forgejo.org/forgejo/download-artifact@v4
        with: { name: client-macos-universal, path: release }
      - uses: https://code.forgejo.org/forgejo/download-artifact@v4
        with: { name: server-linux-x86_64, path: release }
      - uses: https://code.forgejo.org/forgejo/download-artifact@v4
        with: { name: server-linux-aarch64, path: release }
      - uses: https://code.forgejo.org/forgejo/download-artifact@v4
        with: { name: cosign-public-key, path: release }
      - name: Install release tools
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl gnupg jq
          for command in base64 curl gpg jq sha256sum; do command -v "${command}"; done
      - name: Validate unsigned release payload
        shell: bash
        run: |
          set -euo pipefail
          package_patterns=(
            'cords-client-linux-x86_64-*.tar.gz'
            'cords-client-linux-aarch64-*.tar.gz'
            'cords-client-windows-x86_64-*.zip'
            'cords-client-windows-aarch64-*.zip'
            'cords-client-macos-universal-*.dmg'
            'cords-server-linux-x86_64-*.tar.gz'
            'cords-server-linux-aarch64-*.tar.gz'
          )
          for pattern in "${package_patterns[@]}"; do
            test "$(find release -maxdepth 1 -type f -name "${pattern}" | wc -l)" -eq 1
          done
          test "$(find release -maxdepth 1 -type f -name '*.sha256' | wc -l)" -eq 7
          test -s release/cosign.pub
          test "$(find release -maxdepth 1 -type f | wc -l)" -eq 15
          find release -maxdepth 1 -type f -printf '%f\n' | sort
      - name: Create and verify signed checksum manifest
        shell: bash
        env:
          CI_KEY_B64: ${{ secrets.CI_KEY_B64 }}
          CI_KEY_PASSPHRASE: ${{ secrets.CI_KEY_PASSPHRASE }}
        run: bash scripts/sign-release-artifacts.sh release
      - name: Publish canonical Forgejo release
        shell: bash
        run: |
          set -euo pipefail
          : "${FORGEJO_SERVER_URL:?Forgejo did not provide FORGEJO_SERVER_URL}"
          : "${GITHUB_REPOSITORY:?Forgejo did not provide GITHUB_REPOSITORY}"
          export FORGEJO_API_URL="${FORGEJO_API_URL:-${FORGEJO_SERVER_URL}/api/v1}"
          export FORGEJO_REPOSITORY="${GITHUB_REPOSITORY}"
          export RELEASE_BODY="$(cat <<EOF
          Signed Cords desktop clients, Linux server tarballs, and multi-architecture server container.

          Canonical container: ${{ needs.publish-canonical-container.outputs.canonical_reference }}
          EOF
          )"
          bash scripts/publish-release-assets.sh release forgejo
      - uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: signed-release-assets
          path: release/
          if-no-files-found: error
          retention-days: 7

  mirror-github:
    name: Mirror canonical release to GitHub
    needs: [prepare, publish-canonical-container, publish-forgejo-release]
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/catthehacker/ubuntu:act-22.04
    env:
      FORGEJO_TOKEN: ${{ forgejo.token }}
      FORGEJO_USER: ${{ github.actor }}
      RELEASE_NAME: ${{ needs.prepare.outputs.release_name }}
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
      SOURCE_REVISION: ${{ github.sha }}
    steps:
      - uses: https://pubcode.archuser.org/actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: https://code.forgejo.org/forgejo/download-artifact@v4
        with:
          name: signed-release-assets
          path: release
      - name: Install pinned mirror tools
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git jq skopeo
          cosign_version=v3.1.2
          cosign_sha256=f7622ed3cf22e55e1ae6377c080979ff77a22da9981c11df222a2e444991e7cf
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error --output /tmp/cosign "https://github.com/sigstore/cosign/releases/download/${cosign_version}/cosign-linux-amd64"
          printf '%s  %s\n' "${cosign_sha256}" /tmp/cosign | sha256sum --check --strict
          chmod 0755 /tmp/cosign
          echo /tmp >> "${GITHUB_PATH}"
      - name: Mirror source revision and release tag
        shell: bash
        env:
          GH_KEY: ${{ secrets.GH_KEY }}
        run: |
          set -euo pipefail
          : "${GH_KEY:?configure GH_KEY with contents write access}"
          askpass="$(mktemp)"
          trap 'rm -f -- "${askpass}"' EXIT
          cat > "${askpass}" <<'ASKPASS'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' x-access-token ;;
            *Password*) printf '%s\n' "${GH_KEY:?}" ;;
            *) exit 1 ;;
          esac
          ASKPASS
          chmod 0700 "${askpass}"
          export GIT_ASKPASS="${askpass}" GIT_TERMINAL_PROMPT=0
          git remote remove github 2>/dev/null || true
          git remote add github "https://github.com/${GITHUB_MIRROR_REPOSITORY}.git"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            git push github "HEAD:${GITHUB_REF}"
          else
            git push github HEAD:refs/heads/main
            if ! git rev-parse --verify "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
              git tag "${RELEASE_TAG}" "${GITHUB_SHA}"
            fi
            git push github "refs/tags/${RELEASE_TAG}"
          fi
      - name: Authenticate mirror registries
        shell: bash
        env:
          GH_KEY: ${{ secrets.GH_KEY }}
        run: |
          set -euo pipefail
          : "${FORGEJO_TOKEN:?Forgejo did not provide its job token}"
          : "${FORGEJO_USER:?Forgejo did not provide the actor name}"
          : "${GH_KEY:?configure GH_KEY with write:packages scope}"
          printf '%s' "${FORGEJO_TOKEN}" | docker login pubcode.archuser.org --username "${FORGEJO_USER}" --password-stdin
          printf '%s' "${GH_KEY}" | docker login ghcr.io --username firebadnofire --password-stdin
      - name: Mirror and sign server container
        id: mirror_container
        shell: bash
        env:
          COSIGN_B64: ${{ secrets.COSIGN_B64 }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          EXPECTED_CONTAINER_DIGEST: ${{ needs.publish-canonical-container.outputs.container_digest }}
          RELEASE_DIRECTORY: release
          TRACE_TAG: ${{ needs.prepare.outputs.trace_tag }}
        run: bash scripts/publish-container.sh github
      - name: Publish GitHub release mirror
        shell: bash
        env:
          GH_KEY: ${{ secrets.GH_KEY }}
        run: |
          set -euo pipefail
          export GITHUB_REPOSITORY="${GITHUB_MIRROR_REPOSITORY}"
          export RELEASE_BODY="$(cat <<EOF
          Mirror of the canonical Pubcode release containing signed Cords desktop clients and Linux server tarballs.

          Canonical container: ${{ needs.publish-canonical-container.outputs.canonical_reference }}
          GitHub container mirror: ${{ steps.mirror_container.outputs.ghcr_reference }}
          EOF
          )"
          bash scripts/publish-release-assets.sh release github
      - name: Close registry sessions
        if: always()
        shell: bash
        run: |
          docker logout pubcode.archuser.org || true
          docker logout ghcr.io || true
