name: Cords release activation blocked

"on":
  push:
    tags: ["v*", "V*"]
  workflow_dispatch:

# This gate is deliberately skipped, not a successful validation or release.
# Publication requires the external executor gates; this is not credential isolation.
# Retained build definitions: ../workflow-proposals/legacy-release.yml
jobs:
  publication-disabled:
    if: ${{ false }}
    runs-on: ubuntu-22.04
    steps:
      - name: Publication requires reviewed external executor activation
        run: exit 1
