name: Release Cords AppImage

'on':
  push:
    tags: ["v*"]

jobs:
  appimage:
    name: Build, sign, and publish
    runs-on: ubuntu-22.04
    container:
      image: node:24-bookworm
    env:
      DEBIAN_FRONTEND: noninteractive
      CARGO_TERM_COLOR: always
      APPIMAGE_EXTRACT_AND_RUN: "1"
      RELEASE_TOKEN: ${{ forgejo.token }}
    steps:
      - name: Install build tools
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends build-essential ca-certificates curl file git gnupg jq libayatana-appindicator3-dev librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev pkg-config wget
          curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.97.1
          export PATH="${HOME}/.cargo/bin:${PATH}"
          rustup component add rustfmt
      - name: Check out release tag
        shell: bash
        run: |
          set -euo pipefail
          test -n "${FORGEJO_SERVER_URL:-}"
          test -n "${FORGEJO_REPOSITORY:-}"
          test -n "${FORGEJO_REF_NAME:-}"
          git init --initial-branch=main .
          git remote add origin "${FORGEJO_SERVER_URL}/${FORGEJO_REPOSITORY}.git"
          git -c http.extraHeader="Authorization: token ${RELEASE_TOKEN}" fetch --depth=1 origin "refs/tags/${FORGEJO_REF_NAME}"
          git checkout --detach FETCH_HEAD
      - name: Validate and build AppImage
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${HOME}/.cargo/bin:${PATH}"
          cargo fmt --all -- --check
          cargo test --workspace --all-features
          ./scripts/package-appimage.sh
          test -s target/Cords.AppImage
          file target/Cords.AppImage
      - name: Import release key and sign artifact
        shell: bash
        env:
          CI_KEY: ${{ secrets.CI_KEY }}
          CI_KEY_PASSPHRASE: ${{ secrets.CI_KEY_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "${CI_KEY:-}" || { echo "Missing required secret: CI_KEY" >&2; exit 1; }
          test -n "${CI_KEY_PASSPHRASE:-}" || { echo "Missing required secret: CI_KEY_PASSPHRASE" >&2; exit 1; }
          export GNUPGHOME="$(mktemp -d)"
          trap 'rm -rf "${GNUPGHOME}"' EXIT
          key_file="${GNUPGHOME}/release-key"
          umask 077
          if printf '%s' "${CI_KEY}" | grep -q -- '-----BEGIN PGP PRIVATE KEY BLOCK-----'; then printf '%s' "${CI_KEY}" > "${key_file}"; else printf '%s' "${CI_KEY}" | base64 --decode > "${key_file}"; fi
          gpg --batch --import "${key_file}"
          rm -f "${key_file}"
          signing_fingerprint="$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "fpr" { print $10; exit }')"
          test -n "${signing_fingerprint}"
          printf '%s' "${CI_KEY_PASSPHRASE}" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --local-user "${signing_fingerprint}" --armor --detach-sign --output target/Cords.AppImage.asc target/Cords.AppImage
          gpg --batch --verify target/Cords.AppImage.asc target/Cords.AppImage
      - name: Publish Forgejo release
        shell: bash
        run: |
          set -euo pipefail
          api_url="${FORGEJO_API_URL:-${FORGEJO_SERVER_URL}/api/v1}"
          auth_header="Authorization: token ${RELEASE_TOKEN}"
          release_json="$(curl --proto '=https' --tlsv1.2 -fsS -H "${auth_header}" "${api_url}/repos/${FORGEJO_REPOSITORY}/releases/tags/${FORGEJO_REF_NAME}" || true)"
          release_id="$(printf '%s' "${release_json}" | jq -r '.id // empty')"
          if [ -z "${release_id}" ]; then
            payload="$(jq -n --arg tag "${FORGEJO_REF_NAME}" '{tag_name:$tag,name:$tag,body:"Signed Cords Tauri AppImage release.",draft:false,prerelease:false}')"
            release_id="$(curl --proto '=https' --tlsv1.2 -fsS -X POST -H "${auth_header}" -H 'Content-Type: application/json' --data "${payload}" "${api_url}/repos/${FORGEJO_REPOSITORY}/releases" | jq -er '.id')"
          fi
          for artifact in target/Cords.AppImage target/Cords.AppImage.asc; do
            name="$(basename "${artifact}")"
            curl --proto '=https' --tlsv1.2 -fsS -X POST -H "${auth_header}" -H 'Content-Type: application/octet-stream' --data-binary "@${artifact}" "${api_url}/repos/${FORGEJO_REPOSITORY}/releases/${release_id}/assets?name=${name}"
          done
