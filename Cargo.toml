[workspace]
resolver = "3"
members = [
  "bins/cords-client/src-tauri",
  "bins/cords-server",
  "crates/cords-client-core",
  "crates/cords-crypto",
  "crates/cords-identity",
  "crates/cords-protocol",
  "crates/cords-server-core",
  "crates/cords-storage",
  "crates/cords-test-vectors",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/cords-chat/cords"

[workspace.dependencies]
anyhow = "1.0"
axum = "0.8"
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
config = { version = "0.15", default-features = false, features = ["toml"] }
cords-client-core = { version = "0.1.0", path = "crates/cords-client-core" }
cords-protocol = { version = "0.1.0", path = "crates/cords-protocol" }
cords-server-core = { version = "0.1.0", path = "crates/cords-server-core" }
cords-storage = { version = "0.1.0", path = "crates/cords-storage" }
ed25519-dalek = { version = "2.2", features = ["rand_core", "zeroize"] }
hex = "0.4"
minicbor = { version = "0.26", features = ["std"] }
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "sqlite", "migrate"] }
tempfile = "3.20"
thiserror = "2.0"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "signal"] }
tower-http = { version = "0.6", features = ["catch-panic", "limit", "request-id", "timeout", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = { version = "2.5", features = ["serde"] }
uuid = { version = "1.18", features = ["v7", "serde"] }
zeroize = "1.8"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
unwrap_used = "warn"
expect_used = "warn"
