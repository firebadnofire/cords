[package]
name = "cords-qt-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
anyhow.workspace = true
base64.workspace = true
cords-client-core.workspace = true
cords-avatar-codec.workspace = true
cords-protocol.workspace = true
cxx = "=1.0.205"
serde_json.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
uuid.workspace = true
zeroize.workspace = true

[build-dependencies]
cxx-build = "=1.0.205"

[dev-dependencies]
tempfile.workspace = true

[lints.rust]
# CXX generates the audited FFI glue. Only its macro module is allowed to
# contain generated unsafe; handwritten application code remains denied.
unsafe_code = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
unwrap_used = "warn"
expect_used = "warn"
